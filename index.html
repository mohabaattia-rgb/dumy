<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CRUD.css">
</head>
<body>
    
    <!-- Start NavBar -->
     <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Fake Store CRUD
            </a>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAddModal()">+Add Product</button>
        </div>
     </nav>
    <!-- End NavBar -->

    <!-- Main Content -->
     <main class="container py-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h1 class="fw-bold">Products</h1>
                <p class="text-muted">Manage Products using Fake Store API</p>
            </div>
            <!-- Search -->
             <div class="col-md-6">
                <input type="text" placeholder="Search Products...." class="form-control" id="searchInput" onkeyup="searchProducts()">
             </div>
        </div>
        <!-- Loading -->
         <div class="text-center my-5 d-none" id="loading">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">Loading Products.....</p>
         </div>
         <!-- Error -->
          <div class="alert alert-danger d-none" id="errorMessage">
            Something Went Wrong!
          </div>
          <!-- Products -->
           <div id="productsContainer" class="row g-4">

           </div>
     </main>
     <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Header Modal -->
                 <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                 </div>
                <!-- Body Modal -->
                <div class="modal-body">
                    <form id="productForm">
                        <div class="mb-3">
                            <label class="form-label">Product Title</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Price</label>
                            <input type="number" id="price" class="form-control" required step="0.01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Category</label>
                            <input type="text" id="category" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Image</label>
                            <input type="url" id="image" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Description</label>
                            <textarea id="description" class="form-control" rows="4" required></textarea>
                        </div>
                        <input type="hidden" id="productId">
                    </form>
                </div>
                
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">Close</button>
                    <button type="button" id="saveBtn" class="btn btn-primary" onclick="saveProduct()">Save Product</button>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="CRUD.js"></script>
</body>
</html>
